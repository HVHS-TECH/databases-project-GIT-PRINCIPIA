<!DOCTYPE html>
<html>
    <head>
        <title>Alex's Game Site</title>
        <link rel="stylesheet" href="./css/styles.css">
    </head>
    <body>
        <div class="column center span-screen-height">
            <h1>Alex Curwen's Game Site</h1>
            <a href="./html/astro-explorer/start.html"><button disabled id="astro-explorer">ASTRO EXPLORER</button></a>
            <a href="./html/geo-dash/game.html"><button disabled id="geo-dash">GEO DASH</button></a>
            <a href="./html/reviews.html"><button disabled id="reviews">READ OR POST REVIEWS</button></a>
            <div class="br"></div>
            <div class="br"></div>
            <div class="column center" id="i-login" style="display: flex;">
                <p id="o-login-result"></p>
                <button onclick="logInDiffAccount()" id="i-login-diff-account" disabled>Login with a different Google Account</button>
            </div>
            <div class="br"></div>
            
            <p>OR</p>
            <div class="br"></div>
            <div class="center column" id="i-sign-up">
                <div class="row center span-width">
                    <label for="age"><b>Input your age: </b></label>
                    <input id="i-age" name="age" type="number">
                    <p id="o-age-error"></p>
                </div>
                <div class="row center span-width">
                    <label for="name"><b>Input a username: </b></label>
                    <input id="i-name" name="name" type="text">
                    <p id="o-name-error"></p>
                </div>
                <button onclick="signUp()">Sign Up with Google</button>
            </div>
            
            
            
            
            
        </div>
        
        <script type="module" src='./scripts/game-site/game_site.mjs'></script>
    </body>
</html>
