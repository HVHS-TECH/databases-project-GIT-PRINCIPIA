<!DOCTYPE html>
<html id="dark-blue-html">
    <head>
        <script type="module" src="../scripts/utility/requires_fb_and_login.mjs"></script>
        <title>Game Site - Reviews</title>
        <link rel="stylesheet" href="../css/styles.css">
        <script type="module" src="../scripts/data/review_display.mjs"></script>
        <script type="module" src="../scripts/data/review_write_dispatch.mjs"></script>
        <script type="module" src="../scripts/data/high_score_display.mjs"></script>
    </head>
    <body class="span-screen-height center thin">
        <h1>Game Site</h1>
        <h3>Reviews</h3>
        <div class="column reviews-container">
            <div class="column center span-height scroll-frame" style="width: 80%">
            
                <div class="review-input center column">
                    <p><b>Please submit a review!</b></p>
                    <textarea id="i-review" rows="4" columns="50">This is the best Game Site ever!</textarea>
                    <p id="o-review-character-count"></p>
                    <p id="o-review-submit-result"></p>
                    <button onclick="submitReview()">Submit!</button>
                </div>
                <div id="reviews-list-target" class="reviews-list">

                </div>
            </div>
            <div class="bold-br"></div>
        </div>
        
        

        <div class="column bottom center">
            <button onclick="location.href = '../index.html';">Back to Game Site</button>
            <div class="br"></div>
            <div class="br"></div>
            <div class="br"></div>
            <div class="br"></div>
            <div class="br"></div>
        </div>
        
        
    </body>
</html>
